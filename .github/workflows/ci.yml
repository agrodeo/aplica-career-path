name: Aplica CI

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "worker/**"
      - "drizzle/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/**"
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  app-build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test src/lib/job-sources/ src/lib/auto-apply/ scripts/beta-health.test.ts
      - run: bun run build:pages
        env:
          VITE_SUPABASE_URL: https://ctdpjiyxcoytshegnpbc.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture_for_browser_tests
      - run: npm ci --prefix worker
      - run: node scripts/verify-browser-flow.mjs
        env:
          TEST_STATIC_PAGES: "true"

  worker-typecheck:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  public-form-audit:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
    timeout-minutes: 12
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Inspect public employer forms without submitting applications
        run: node scripts/audit-public-forms.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-form-audit
          path: worker/.artifacts/public-form-audit.json
          if-no-files-found: warn
          retention-days: 14
