name: LATAM Inventory Sync

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/latam-sync.yml"
      - "scripts/sync-latam-jobs.ts"
      - "drizzle/migrations/**"

concurrency:
  group: aplica-latam-inventory-sync-v2
  cancel-in-progress: true

jobs:
  sync-latam:
    concurrency:
      group: aplica-provider-sync-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: greenhouse
            providers: greenhouse
          - shard: smartrecruiters
            providers: smartrecruiters
          - shard: workday
            providers: workday
          - shard: custom
            providers: custom
          - shard: other
            providers: lever,ashby,workable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://ctdpjiyxcoytshegnpbc.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SYNC_PROVIDERS: ${{ matrix.providers }}

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Refresh LATAM and newly added boards
        run: bun scripts/sync-latam-jobs.ts
