name: Beta Health
on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/beta-health.ts", ".github/workflows/beta-health.yml"]
permissions:
  contents: read
concurrency:
  group: aplica-beta-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check production without submitting applications
        env:
          SUPABASE_URL: https://ctdpjiyxcoytshegnpbc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HEALTH_REPORT_PATH: beta-health.json
        run: bun scripts/beta-health.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-health-${{ github.run_id }}
          path: beta-health.json
          retention-days: 14
          if-no-files-found: warn
