name: Inventory Sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inventory-sync.yml"
      - "scripts/sync-jobs.ts"
      - "src/lib/job-sync.server.ts"
      - "src/lib/job-sources/**"

concurrency:
  group: aplica-inventory-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: greenhouse
            providers: greenhouse
          - shard: smartrecruiters
            providers: smartrecruiters
          - shard: workday
            providers: workday
          - shard: other
            providers: lever,ashby,workable
    env:
      SUPABASE_URL: https://ctdpjiyxcoytshegnpbc.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SYNC_PROVIDERS: ${{ matrix.providers }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Sync registered ATS boards
        run: bun scripts/sync-jobs.ts
