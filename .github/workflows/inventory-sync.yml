name: Fresh Job Inventory

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fresh-job-inventory
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Sync stale job boards
        env:
          CRON_API_TOKEN: ${{ secrets.CRON_API_TOKEN }}
          APLICA_BASE_URL: ${{ vars.APLICA_BASE_URL }}
        run: |
          set -euo pipefail
          BASE_URL="${APLICA_BASE_URL:-https://aplica-career-path.lovable.app}"
          if [ -z "${CRON_API_TOKEN:-}" ]; then
            echo "Missing GitHub Actions secret CRON_API_TOKEN"
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 \
            -X POST \
            -H "Authorization: Bearer ${CRON_API_TOKEN}" \
            "${BASE_URL%/}/api/public/cron/sync-jobs?freshnessMinutes=10&limit=100"
