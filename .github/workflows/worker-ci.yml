name: Auto Apply CI

on:
  pull_request:
    paths:
      - "worker/**"
      - "src/lib/worker-*.server.ts"
      - "src/routes/api/public/worker/**"
      - "src/routeTree.gen.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/worker-ci.yml"
  push:
    branches:
      - "chatgpt/auto-apply-worker-hardening"
    paths:
      - "worker/**"
      - "src/lib/worker-*.server.ts"
      - "src/routes/api/public/worker/**"
      - "src/routeTree.gen.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/worker-ci.yml"

permissions:
  contents: read

jobs:
  worker-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  app-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
