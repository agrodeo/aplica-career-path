name: Auto Apply CI

on:
  pull_request:
    paths:
      - "worker/**"
      - "src/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/worker-ci.yml"
  push:
    branches:
      - "main"
    paths:
      - "worker/**"
      - "src/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/worker-ci.yml"

permissions:
  contents: read

jobs:
  worker-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test

  app-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test src/lib/cv-parse.test.ts src/lib/cv-extract.test.ts src/lib/job-sources/registry.test.ts
      - run: bun run build
