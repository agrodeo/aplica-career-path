name: Auto Apply Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/auto-apply-worker.yml"

concurrency:
  group: aplica-auto-apply-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-jammy
    defaults:
      run:
        working-directory: worker
    env:
      SUPABASE_URL: https://ctdpjiyxcoytshegnpbc.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WORKER_MODE: production
      DRY_RUN: "false"
      RUN_ONCE: "true"
      MAX_CONCURRENCY: "4"
      WORKER_ID: github-actions-${{ github.run_id }}
      LOG_LEVEL: info

    steps:
      - uses: actions/checkout@v4

      - name: Install worker dependencies
        run: npm ci

      - name: Build worker
        run: npm run build

      - name: Process pending applications
        run: npm start
